spin_manifest_version = 2

[application]
name        = "static-site"
version     = "1.0.0"
description = "Static website served via Fermyon Spin / WebAssembly"

# ── HTTP trigger: catch every request and route to the fileserver component ──
[[trigger.http]]
route     = "/..."
component = "fileserver"

# ── Static-fileserver component ───────────────────────────────────────────────
# The Fermyon spin-fileserver is a pre-compiled WASM binary that reads files
# from a mounted directory and returns them as HTTP responses.
# Source: https://github.com/fermyon/spin-fileserver
[component.fileserver]
source = { url = "https://github.com/fermyon/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
# Mount the static-files directory at / (Spin v2: `files` is an array of mounts)
files  = [ { source = "public/", destination = "/" } ]
