# Performance-optimised nginx configuration for static-site hosting
# Features: HTTP/2, TLS 1.2/1.3, gzip, browser caching, security headers,
#           SPA fallback, health-check endpoint.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1000;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/javascript;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html index.htm;

        # ── TLS ─────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (only effective with a CA-signed certificate)
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ── Security headers ─────────────────────────────────────────────────
        # NOTE: nginx does not inherit add_header from parent contexts when a
        # child location defines its own add_header.  To guarantee every response
        # carries these headers we define them here AND repeat them in each
        # location block below via the `always` flag.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

        # ── Immutable cache for versioned static assets ──────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|mp4|webp|avif|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            # Security headers must be repeated here (nginx add_header inheritance)
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options           "SAMEORIGIN"                                   always;
            add_header X-Content-Type-Options    "nosniff"                                      always;
            add_header X-XSS-Protection          "1; mode=block"                                always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
            add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
            access_log off;
        }

        # ── No-cache for HTML (ensures users always get the latest shell) ────
        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            # Security headers must be repeated here (nginx add_header inheritance)
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options           "SAMEORIGIN"                                   always;
            add_header X-Content-Type-Options    "nosniff"                                      always;
            add_header X-XSS-Protection          "1; mode=block"                                always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
            add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        }

        # ── SPA fallback (React / Vue / Angular router) ──────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Health-check (useful for load-balancer probes) ───────────────────
        location = /health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "healthy\n";
        }
    }
}
